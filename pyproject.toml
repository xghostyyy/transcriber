[project]
name = "transcriber"
version = "0.1.0"
description = "Консольный транскрибатор видео: ссылка на YouTube, Shorts, TikTok, Instagram и другие площадки — и готовый текст на русском или английском"
readme = "README.md"
authors = [
    { name = "xghostyyy", email = "dihh.online@mail.ru" }
]
keywords = ["transcription", "whisper", "speech-to-text", "yt-dlp", "cli"]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "av<19",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pyperclip>=1.11.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
